name: Deploy backend
description: >-
  Deploy the backend to a Fly app, wired to one Neon branch. Pulls the
  branch's pooled DATABASE_URL and Realtime URL/secret from Neon on every
  deploy (so nothing is copied by hand, and rotated credentials are picked up
  automatically) and stages them as Fly secrets. Expects .github/deploy.env
  to be loaded into the environment already.

inputs:
  app:
    description: Fly app name (created in FLY_ORG if missing)
    required: true
  neon-branch:
    description: Neon branch the backend reads and writes
    required: true
  allowed-origin:
    description: CORS origin the backend accepts
    required: true
  neon-api-key:
    required: true
  fly-api-token:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Ensure Fly app exists
      shell: bash
      env:
        FLY_API_TOKEN: ${{ inputs.fly-api-token }}
        APP: ${{ inputs.app }}
      run: |
        if ! flyctl apps list --json | jq -e --arg n "$APP" '.[] | select(.Name == $n)' > /dev/null; then
          flyctl apps create "$APP" --org "$FLY_ORG"
        fi

    - name: Stage Neon credentials as Fly secrets
      shell: bash
      env:
        NEON_API_KEY: ${{ inputs.neon-api-key }}
        FLY_API_TOKEN: ${{ inputs.fly-api-token }}
        APP: ${{ inputs.app }}
        NEON_BRANCH: ${{ inputs.neon-branch }}
      run: |
        # Waits for Realtime provisioning if the branch is brand new. Each
        # branch has its own URL and secret, so always pull this branch's.
        env_file="$RUNNER_TEMP/neon.env"
        trap 'rm -f "$env_file"' EXIT
        npx -y "$NEON_CLI" env pull --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH" \
          --service postgres --service realtime --file "$env_file" > /dev/null
        read_var() { sed -n "s/^$1=//p" "$env_file" | tail -n1 | sed -e "s/^[\"']//" -e "s/[\"']\$//"; }
        database_url="$(read_var DATABASE_URL)"
        realtime_url="$(read_var NEON_REALTIME_URL)"
        realtime_secret="$(read_var NEON_REALTIME_SECRET)"
        for v in database_url realtime_url realtime_secret; do
          if [ -z "${!v}" ]; then
            echo "::error::neon env pull did not produce ${v^^} for branch $NEON_BRANCH"
            exit 1
          fi
        done
        echo "::add-mask::$database_url"
        echo "::add-mask::$realtime_secret"
        flyctl secrets set --app "$APP" --stage \
          DATABASE_URL="$database_url" \
          NEON_REALTIME_URL="$realtime_url" \
          NEON_REALTIME_SECRET="$realtime_secret"

    - name: Deploy
      shell: bash
      env:
        FLY_API_TOKEN: ${{ inputs.fly-api-token }}
        APP: ${{ inputs.app }}
        ALLOWED_ORIGIN: ${{ inputs.allowed-origin }}
      run: |
        flyctl deploy --app "$APP" --config fly.backend.toml --remote-only \
          --env NEON_DB_NAME="$NEON_DB_NAME" \
          --env WORKOS_JWKS_URL="https://api.workos.com/sso/jwks/$WORKOS_CLIENT_ID" \
          --env ALLOWED_ORIGIN="$ALLOWED_ORIGIN"
