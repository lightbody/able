name: Deploy backend
description: >-
  Deploy the backend to a Fly app. Each feature the backend uses adds its own
  step below, which stages that feature's Fly secrets and appends its
  runtime settings (KEY=value lines) to $RUNNER_TEMP/backend.env; the last
  step deploys with them. Expects .github/deploy.env to be loaded into the
  environment already.

inputs:
  app:
    description: Fly app name (created in FLY_ORG if missing)
    required: true
  allowed-origin:
    description: CORS origin the backend accepts
    required: true
  fly-api-token:
    required: true
  # able:begin postgres
  neon-branch:
    description: Neon branch the backend reads and writes
    required: true
  neon-api-key:
    required: true
  # able:end
  # able:begin observability
  environment:
    description: >-
      deployment.environment.name on all telemetry, naming the app and
      which deploy: "<APP_HANDLE>" for Production, "<APP_HANDLE>-pr<n>" for
      a Preview
    required: true
  grafana-otlp-token:
    description: >-
      Grafana Cloud access policy token (metrics:write, logs:write,
      traces:write). Without it the backend still deploys, with telemetry
      off and a warning.
    required: false
    default: ""
  # able:end

runs:
  using: composite
  steps:
    - uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Ensure Fly app exists
      shell: bash
      env:
        FLY_API_TOKEN: ${{ inputs.fly-api-token }}
        APP: ${{ inputs.app }}
        ALLOWED_ORIGIN: ${{ inputs.allowed-origin }}
      run: |
        if ! flyctl apps list --json | jq -e --arg n "$APP" '.[] | select(.Name == $n)' > /dev/null; then
          flyctl apps create "$APP" --org "$FLY_ORG"
        fi
        # Start the runtime settings file. The steps below append to it.
        echo "ALLOWED_ORIGIN=$ALLOWED_ORIGIN" > "$RUNNER_TEMP/backend.env"

    # able:begin auth
    - name: Sign-in settings (WorkOS)
      shell: bash
      run: echo "WORKOS_JWKS_URL=https://api.workos.com/sso/jwks/$WORKOS_CLIENT_ID" >> "$RUNNER_TEMP/backend.env"
    # able:end

    # able:begin postgres
    - name: Database credentials (Neon)
      uses: ./.github/actions/postgres-stage
      with:
        app: ${{ inputs.app }}
        neon-branch: ${{ inputs.neon-branch }}
        neon-api-key: ${{ inputs.neon-api-key }}
        fly-api-token: ${{ inputs.fly-api-token }}
    # able:end

    # able:begin observability
    - name: Telemetry credentials (Grafana Cloud)
      uses: ./.github/actions/observability-stage
      with:
        app: ${{ inputs.app }}
        environment: ${{ inputs.environment }}
        grafana-otlp-token: ${{ inputs.grafana-otlp-token }}
        fly-api-token: ${{ inputs.fly-api-token }}
    # able:end

    - name: Deploy
      shell: bash
      env:
        FLY_API_TOKEN: ${{ inputs.fly-api-token }}
        APP: ${{ inputs.app }}
      run: |
        env_args=()
        while IFS= read -r line; do
          [ -n "$line" ] && env_args+=(--env "$line")
        done < "$RUNNER_TEMP/backend.env"
        flyctl deploy --app "$APP" --config fly.backend.toml --remote-only "${env_args[@]}"
