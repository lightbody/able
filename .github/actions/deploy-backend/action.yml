name: Deploy backend
description: >-
  Deploy the backend to a Fly app, wired to one Neon branch. Pulls the
  branch's pooled DATABASE_URL and Realtime URL/secret from Neon on every
  deploy (so nothing is copied by hand, and rotated credentials are picked up
  automatically) and stages them as Fly secrets. When Grafana Cloud is
  configured, also turns on OpenTelemetry export (traces, metrics, logs).
  Expects .github/deploy.env to be loaded into the environment already.

inputs:
  app:
    description: Fly app name (created in FLY_ORG if missing)
    required: true
  neon-branch:
    description: Neon branch the backend reads and writes
    required: true
  allowed-origin:
    description: CORS origin the backend accepts
    required: true
  neon-api-key:
    required: true
  fly-api-token:
    required: true
  environment:
    description: >-
      deployment.environment.name on all telemetry: "production", or "pr-<n>"
      for a PR preview
    required: true
  grafana-otlp-token:
    description: >-
      Grafana Cloud access policy token (metrics:write, logs:write,
      traces:write). Without it the backend still deploys, with telemetry
      off and a warning.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Ensure Fly app exists
      shell: bash
      env:
        FLY_API_TOKEN: ${{ inputs.fly-api-token }}
        APP: ${{ inputs.app }}
      run: |
        if ! flyctl apps list --json | jq -e --arg n "$APP" '.[] | select(.Name == $n)' > /dev/null; then
          flyctl apps create "$APP" --org "$FLY_ORG"
        fi

    - name: Stage Neon credentials as Fly secrets
      shell: bash
      env:
        NEON_API_KEY: ${{ inputs.neon-api-key }}
        FLY_API_TOKEN: ${{ inputs.fly-api-token }}
        APP: ${{ inputs.app }}
        NEON_BRANCH: ${{ inputs.neon-branch }}
      run: |
        # Waits for Realtime provisioning if the branch is brand new. Each
        # branch has its own URL and secret, so always pull this branch's.
        env_file="$RUNNER_TEMP/neon.env"
        trap 'rm -f "$env_file"' EXIT
        npx -y "$NEON_CLI" env pull --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH" \
          --service postgres --service realtime --file "$env_file" > /dev/null
        read_var() { sed -n "s/^$1=//p" "$env_file" | tail -n1 | sed -e "s/^[\"']//" -e "s/[\"']\$//"; }
        database_url="$(read_var DATABASE_URL)"
        realtime_url="$(read_var NEON_REALTIME_URL)"
        realtime_secret="$(read_var NEON_REALTIME_SECRET)"
        for v in database_url realtime_url realtime_secret; do
          if [ -z "${!v}" ]; then
            echo "::error::neon env pull did not produce ${v^^} for branch $NEON_BRANCH"
            exit 1
          fi
        done
        echo "::add-mask::$database_url"
        echo "::add-mask::$realtime_secret"
        flyctl secrets set --app "$APP" --stage \
          DATABASE_URL="$database_url" \
          NEON_REALTIME_URL="$realtime_url" \
          NEON_REALTIME_SECRET="$realtime_secret"

    - name: Stage Grafana Cloud credentials as a Fly secret
      id: otel
      shell: bash
      env:
        FLY_API_TOKEN: ${{ inputs.fly-api-token }}
        APP: ${{ inputs.app }}
        GRAFANA_OTLP_TOKEN: ${{ inputs.grafana-otlp-token }}
      run: |
        if [ -z "${GRAFANA_OTLP_ENDPOINT:-}" ] || [ -z "${GRAFANA_OTLP_INSTANCE_ID:-}" ] || [ -z "$GRAFANA_OTLP_TOKEN" ]; then
          echo "::warning::Telemetry is off: the GRAFANA_OTLP_TOKEN secret is missing (or deploy.env's GRAFANA_OTLP_* values are empty)."
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # OTLP/HTTP Basic auth: <instance id>:<token>. The SDK URL-decodes
        # OTEL_EXPORTER_OTLP_HEADERS values, hence %20 for the space.
        basic="$(printf '%s:%s' "$GRAFANA_OTLP_INSTANCE_ID" "$GRAFANA_OTLP_TOKEN" | base64 -w0)"
        echo "::add-mask::$basic"
        flyctl secrets set --app "$APP" --stage \
          OTEL_EXPORTER_OTLP_HEADERS="Authorization=Basic%20$basic"
        echo "enabled=true" >> "$GITHUB_OUTPUT"

    - name: Deploy
      shell: bash
      env:
        FLY_API_TOKEN: ${{ inputs.fly-api-token }}
        APP: ${{ inputs.app }}
        ALLOWED_ORIGIN: ${{ inputs.allowed-origin }}
        OTEL_ENABLED: ${{ steps.otel.outputs.enabled }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        otel_env=()
        if [ "$OTEL_ENABLED" = "true" ]; then
          # Without OTEL_EXPORTER_OTLP_ENDPOINT the backend never starts the
          # SDK (backend/src/telemetry.ts), so this is the on/off switch.
          otel_env=(
            --env OTEL_EXPORTER_OTLP_ENDPOINT="$GRAFANA_OTLP_ENDPOINT"
            --env OTEL_SERVICE_NAME="$APP_HANDLE-backend"
            --env OTEL_RESOURCE_ATTRIBUTES="service.namespace=$APP_HANDLE,deployment.environment.name=$DEPLOY_ENVIRONMENT,service.version=$GITHUB_SHA"
          )
        fi
        flyctl deploy --app "$APP" --config fly.backend.toml --remote-only \
          --env NEON_DB_NAME="$NEON_DB_NAME" \
          --env WORKOS_JWKS_URL="https://api.workos.com/sso/jwks/$WORKOS_CLIENT_ID" \
          --env ALLOWED_ORIGIN="$ALLOWED_ORIGIN" \
          "${otel_env[@]}"
