name: Deploy config

# Reusable check: deploy jobs run only once every *required* module in
# .github/deploy.env is filled in. Keeps the empty template, and a new app
# mid-setup, from attempting (and failing) deploys. Optional modules (like
# grafana) never block a deploy; `modules` lists the ones that are on.
on:
  workflow_call:
    outputs:
      configured:
        description: "'true' when every required module in .github/deploy.env is filled in"
        value: ${{ jobs.check.outputs.configured }}
      modules:
        description: "Space-separated optional modules that are on, e.g. 'grafana'"
        value: ${{ jobs.check.outputs.modules }}

jobs:
  check:
    name: Check deploy config
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      modules: ${{ steps.check.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: .github/scripts/deploy-config.sh check
