name: Preview Environment

# One Preview per pull request. The frontend's Pages preview is deployed by
# frontend.yml; this workflow brings up everything behind it, one step per
# feature, and tears it all down when the PR closes.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# able:begin postgres
env:
  NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}
# able:end

jobs:
  config:
    uses: ./.github/workflows/deploy-config.yml

  # able:begin backend
  deploy:
    name: Deploy preview
    needs: config
    if: github.event.action != 'closed' && needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Load deploy config
        run: grep -Ev '^\s*(#|$)' .github/deploy.env >> "$GITHUB_ENV"

      - name: Set preview names
        run: echo "BACKEND_APP=$FLY_BACKEND_APP-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"

      # able:begin postgres
      - name: Create the Preview's database
        uses: ./.github/actions/postgres-preview-up
        with:
          neon-branch: ${{ env.NEON_BRANCH }}
          neon-api-key: ${{ secrets.NEON_API_KEY }}
      # able:end

      - name: Deploy backend
        uses: ./.github/actions/deploy-backend
        with:
          app: ${{ env.BACKEND_APP }}
          # Preview-only: swap this for a real per-PR origin check once the
          # app sends credentialed requests.
          allowed-origin: '*'
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
          neon-branch: ${{ env.NEON_BRANCH }} # able:only postgres
          neon-api-key: ${{ secrets.NEON_API_KEY }} # able:only postgres
          environment: ${{ env.APP_HANDLE }}-pr${{ github.event.pull_request.number }} # able:only observability
          grafana-otlp-token: ${{ secrets.GRAFANA_OTLP_TOKEN }} # able:only observability

      - name: Update preview environment comment
        uses: actions/github-script@v7
        with:
          script: |
            const { upsertPreviewComment } = require('./.github/scripts/preview-comment.js');
            await upsertPreviewComment(github, context, {
              backendUrl: `https://${process.env.BACKEND_APP}.fly.dev/health`,
              neonBranch: process.env.NEON_BRANCH, // able:only postgres
              neonProjectId: process.env.NEON_PROJECT_ID, // able:only postgres
              grafanaStackUrl: process.env.GRAFANA_STACK_URL, // able:only observability
              deployEnvironment: `${process.env.APP_HANDLE}-pr${{ github.event.pull_request.number }}`, // able:only observability
            });
  # able:end

  cleanup:
    name: Tear down preview
    needs: config
    if: github.event.action == 'closed' && needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Load deploy config
        run: grep -Ev '^\s*(#|$)' .github/deploy.env >> "$GITHUB_ENV"

      # able:begin backend
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Destroy Fly app
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl apps destroy "$FLY_BACKEND_APP-pr-${{ github.event.pull_request.number }}" --yes || true
      # able:end

      # able:begin postgres
      - name: Delete Neon branch
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}
      # able:end

      - name: Delete Cloudflare Pages preview deployments
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A branch name is text someone chose: pass it as data, never
          # paste it into the script.
          HEAD_REF: ${{ github.head_ref }}
        with:
          script: |
            const { deleteCloudflarePreviewDeployments } = require('./.github/scripts/cleanup-cf-pages.js');
            await deleteCloudflarePreviewDeployments({
              accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
              apiToken: process.env.CLOUDFLARE_API_TOKEN,
              projectName: process.env.CLOUDFLARE_PAGES_PROJECT,
              branch: process.env.HEAD_REF,
            });
