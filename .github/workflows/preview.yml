name: Preview Environment

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}

jobs:
  config:
    uses: ./.github/workflows/deploy-config.yml

  deploy:
    name: Deploy preview
    needs: config
    if: github.event.action != 'closed' && needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Load deploy config
        run: grep -Ev '^\s*(#|$)' .github/deploy.env >> "$GITHUB_ENV"

      - name: Set preview names
        run: echo "BACKEND_APP=$FLY_BACKEND_APP-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"

      - name: Create Neon branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: ${{ env.NEON_PROD_BRANCH }}
          branch_name: ${{ env.NEON_BRANCH }}
          # The action looks up connection info for these (defaults:
          # neondb/neondb_owner) and fails if they don't exist.
          database: ${{ env.NEON_DB_NAME }}
          role: ${{ env.NEON_DB_ROLE }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Neon Realtime
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          # The branch already inherits Realtime from its parent, but also the
          # parent's prod-only allowed origins, and every PR's Pages preview has
          # its own origin -- so allow any. Origins are defense in depth only:
          # the sealed query is the real authorization. Idempotent on re-runs.
          npx -y "$NEON_CLI" realtime enable \
            --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH" --allowed-origin '*'

      - name: Deploy backend
        uses: ./.github/actions/deploy-backend
        with:
          app: ${{ env.BACKEND_APP }}
          neon-branch: ${{ env.NEON_BRANCH }}
          # Preview-only: swap this for a real per-PR origin check once the
          # app sends credentialed requests.
          allowed-origin: '*'
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
          environment: pr-${{ github.event.pull_request.number }}
          grafana-otlp-token: ${{ secrets.GRAFANA_OTLP_TOKEN }}

      - name: Update preview environment comment
        uses: actions/github-script@v7
        with:
          script: |
            const { upsertPreviewComment } = require('./.github/scripts/preview-comment.js');
            await upsertPreviewComment(github, context, {
              backendUrl: `https://${process.env.BACKEND_APP}.fly.dev/health`,
              neonBranch: process.env.NEON_BRANCH,
              neonProjectId: process.env.NEON_PROJECT_ID,
              grafanaStackUrl: process.env.GRAFANA_STACK_URL,
              deployEnvironment: 'pr-${{ github.event.pull_request.number }}',
            });

  cleanup:
    name: Tear down preview
    needs: config
    if: github.event.action == 'closed' && needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Load deploy config
        run: grep -Ev '^\s*(#|$)' .github/deploy.env >> "$GITHUB_ENV"

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Destroy Fly app
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl apps destroy "$FLY_BACKEND_APP-pr-${{ github.event.pull_request.number }}" --yes || true

      - name: Delete Neon branch
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Delete Cloudflare Pages preview deployments
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { deleteCloudflarePreviewDeployments } = require('./.github/scripts/cleanup-cf-pages.js');
            await deleteCloudflarePreviewDeployments({
              accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
              apiToken: '${{ secrets.CLOUDFLARE_API_TOKEN }}',
              projectName: process.env.CLOUDFLARE_PAGES_PROJECT,
              branch: '${{ github.head_ref }}',
            });
